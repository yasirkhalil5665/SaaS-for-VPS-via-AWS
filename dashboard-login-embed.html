<style>
  .lg-wrap {
    font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
    max-width: 420px;
    margin: 90px auto;
    padding: 0 20px;
  }
  .lg-head {
    text-align: center;
    margin-bottom: 30px;
  }
  .lg-head .eyebrow {
    display: inline-block;
    background: #f3e8f1;
    color: #714B67;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .lg-head h2 {
    font-size: 28px;
    font-weight: 800;
    color: #0f0f1a;
    margin: 0 0 8px;
    letter-spacing: -0.5px;
  }
  .lg-head p {
    color: #6b7280;
    font-size: 14px;
  }
  .lg-card {
    background: linear-gradient(160deg, #2b1930 0%, #714B67 100%);
    border-radius: 20px;
    padding: 36px 30px;
    color: #fff;
    box-shadow: 0 20px 50px rgba(43, 25, 48, 0.25);
    position: relative;
    overflow: hidden;
  }
  .lg-card::before {
    content: "";
    position: absolute;
    top: -60px;
    right: -60px;
    width: 180px;
    height: 180px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .lg-field {
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }
  .lg-field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.75;
    margin-bottom: 8px;
  }
  .lg-field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
  }
  .lg-field input::placeholder { color: rgba(255,255,255,0.45); }
  .lg-field input:focus {
    border-color: #fff;
    background: rgba(255,255,255,0.14);
  }
  .lg-submit {
    width: 100%;
    padding: 13px 0;
    border-radius: 10px;
    border: none;
    background: #fff;
    color: #2b1930;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
    position: relative;
    z-index: 1;
  }
  .lg-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .lg-error {
    margin-top: 16px;
    font-size: 13px;
    text-align: center;
    background: rgba(255,255,255,0.12);
    padding: 10px;
    border-radius: 8px;
    display: none;
    position: relative;
    z-index: 1;
  }
  .lg-error.show { display: block; }
</style>

<div class="lg-wrap">
  <div class="lg-head">
    <span class="eyebrow">Instance Login</span>
    <h2>Access Your Dashboard</h2>
    <p>Use your subdomain and admin password from your welcome email.</p>
  </div>

  <div class="lg-card">
    <form id="dashboard-login-form">
      <div class="lg-field">
        <label>Subdomain</label>
        <input type="text" id="login-slug" placeholder="e.g. acme" required/>
      </div>
      <div class="lg-field">
        <label>Admin Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="lg-submit" id="login-submit-btn">Log In</button>
    </form>
    <div class="lg-error" id="lg-error"></div>
  </div>
</div>

<script>
(function() {
  var API_BASE = "http://localhost:8000"; // change to your real API domain in production
  var DASHBOARD_PATH = "/dashboard"; // change if your dashboard page has a different URL

  var urlParams = new URLSearchParams(window.location.search);
  var preslug = urlParams.get("slug");
  if (preslug) {
    document.getElementById("login-slug").value = preslug;
  }

  document.getElementById("dashboard-login-form").addEventListener("submit", function(e) {
    e.preventDefault();

    var slug = document.getElementById("login-slug").value.trim().toLowerCase();
    var password = document.getElementById("login-password").value;
    var errDiv = document.getElementById("lg-error");
    var btn = document.getElementById("login-submit-btn");
    errDiv.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Checking...";

    fetch(API_BASE + "/instances/" + slug, {
      headers: { "X-Instance-Password": password }
    })
      .then(function(res) {
        if (res.status === 401) throw new Error("Incorrect password.");
        if (!res.ok) throw new Error("Instance not found.");
        return res.json();
      })
      .then(function() {
        // Store the verified session for this tab only, then move to the dashboard
        sessionStorage.setItem("instance_slug", slug);
        sessionStorage.setItem("instance_password", password);
        window.location.href = DASHBOARD_PATH + "?slug=" + encodeURIComponent(slug);
      })
      .catch(function(err) {
        errDiv.textContent = err.message;
        errDiv.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Log In";
      });
  });
})();
</script>
