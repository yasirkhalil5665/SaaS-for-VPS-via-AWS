<style>
  .db-wrap {
    font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
    max-width: 640px;
    margin: 60px auto;
    padding: 0 20px;
  }
  .db-head {
    text-align: center;
    margin-bottom: 30px;
  }
  .db-head .eyebrow {
    display: inline-block;
    background: #f3e8f1;
    color: #714B67;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .db-head h2 {
    font-size: 30px;
    font-weight: 800;
    color: #0f0f1a;
    margin: 0 0 8px;
    letter-spacing: -0.5px;
  }
  .db-lookup {
    display: flex;
    gap: 10px;
    max-width: 400px;
    margin: 0 auto 30px;
  }
  .db-lookup input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 14px;
  }
  .db-lookup button {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: #714B67;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  .db-card {
    background: linear-gradient(160deg, #2b1930 0%, #714B67 100%);
    border-radius: 20px;
    padding: 32px;
    color: #fff;
    box-shadow: 0 20px 50px rgba(43, 25, 48, 0.25);
    display: none;
  }
  .db-card.show { display: block; }
  .db-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    font-size: 14px;
  }
  .db-row:last-of-type { border-bottom: none; }
  .db-row .label { opacity: 0.7; }
  .db-row .value { font-weight: 700; }
  .db-status-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .db-status-badge.running { background: #1f8b4c; }
  .db-status-badge.exited { background: #8b1f1f; }
  .db-status-badge.unknown { background: #666; }
  .db-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }
  .db-actions button {
    flex: 1;
    padding: 12px 0;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .db-actions button:hover { transform: translateY(-2px); }
  .db-actions button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-start { background: #1f8b4c; color: #fff; }
  .btn-stop { background: #8b1f1f; color: #fff; }
  .btn-restart { background: #fff; color: #2b1930; }
  .db-error {
    text-align: center;
    color: #8b1f1f;
    font-size: 14px;
    margin-top: 10px;
    display: none;
  }
  .db-error.show { display: block; }
</style>

<div class="db-wrap">
  <div class="db-head">
    <span class="eyebrow">Instance Dashboard</span>
    <h2>Manage Your Instance</h2>
  </div>

  <div class="db-lookup">
    <input type="text" id="lookup-slug" placeholder="Enter your subdomain (e.g. acme)"/>
    <button id="lookup-btn">View</button>
  </div>
  <div class="db-error" id="db-error"></div>

  <div class="db-card" id="db-card">
    <div class="db-row">
      <span class="label">Instance</span>
      <span class="value" id="db-slug"></span>
    </div>
    <div class="db-row">
      <span class="label">Status</span>
      <span class="value"><span class="db-status-badge" id="db-status-badge"></span></span>
    </div>
    <div class="db-row">
      <span class="label">Database</span>
      <span class="value" id="db-db-status"></span>
    </div>
    <div class="db-row">
      <span class="label">CPU Usage</span>
      <span class="value" id="db-cpu">—</span>
    </div>
    <div class="db-row">
      <span class="label">Memory Usage</span>
      <span class="value" id="db-mem">—</span>
    </div>
    <div class="db-row">
      <span class="label">Started At</span>
      <span class="value" id="db-started"></span>
    </div>

    <div class="db-actions">
      <button class="btn-start" id="btn-start">Start</button>
      <button class="btn-stop" id="btn-stop">Stop</button>
      <button class="btn-restart" id="btn-restart">Restart</button>
    </div>
  </div>
</div>

<script>
(function() {
  var API_BASE = "http://localhost:8000"; // change to your real API domain in production
  var currentSlug = null;

  var urlParams = new URLSearchParams(window.location.search);
  var preslug = urlParams.get("slug");
  if (preslug) {
    document.getElementById("lookup-slug").value = preslug;
  }

  document.getElementById("lookup-btn").addEventListener("click", function() {
    var slug = document.getElementById("lookup-slug").value.trim().toLowerCase();
    if (!slug) return;
    loadStatus(slug);
  });

  document.getElementById("btn-start").addEventListener("click", function() { doAction("start"); });
  document.getElementById("btn-stop").addEventListener("click", function() { doAction("stop"); });
  document.getElementById("btn-restart").addEventListener("click", function() { doAction("restart"); });

  function showError(msg) {
    var errDiv = document.getElementById("db-error");
    errDiv.textContent = msg;
    errDiv.classList.add("show");
    document.getElementById("db-card").classList.remove("show");
  }

  function loadStatus(slug) {
    var errDiv = document.getElementById("db-error");
    errDiv.classList.remove("show");

    fetch(API_BASE + "/instances/" + slug)
      .then(function(res) {
        if (!res.ok) throw new Error("Instance not found");
        return res.json();
      })
      .then(function(data) {
        currentSlug = slug;
        renderStatus(slug, data);
      })
      .catch(function(err) {
        showError("Could not find instance: " + slug);
      });
  }

  function renderStatus(slug, data) {
    document.getElementById("db-card").classList.add("show");
    document.getElementById("db-slug").textContent = slug;

    var status = data.odoo_status || "unknown";
    var badge = document.getElementById("db-status-badge");
    badge.textContent = status;
    badge.className = "db-status-badge " + (status === "running" ? "running" : (status === "exited" ? "exited" : "unknown"));

    document.getElementById("db-db-status").textContent = data.db_status || "unknown";
    document.getElementById("db-started").textContent = data.odoo_started_at ? new Date(data.odoo_started_at).toLocaleString() : "—";

    if (data.stats) {
      document.getElementById("db-cpu").textContent = data.stats.cpu || "—";
      document.getElementById("db-mem").textContent = data.stats.mem || "—";
    } else {
      document.getElementById("db-cpu").textContent = "—";
      document.getElementById("db-mem").textContent = "—";
    }

    var running = status === "running";
    document.getElementById("btn-start").disabled = running;
    document.getElementById("btn-stop").disabled = !running;
    document.getElementById("btn-restart").disabled = !running;
  }

  function doAction(action) {
    if (!currentSlug) return;
    var buttons = document.querySelectorAll(".db-actions button");
    buttons.forEach(function(b) { b.disabled = true; });

    fetch(API_BASE + "/instances/" + currentSlug + "/" + action, { method: "POST" })
      .then(function(res) { return res.json(); })
      .then(function() {
        setTimeout(function() { loadStatus(currentSlug); }, 2000);
      })
      .catch(function(err) {
        showError("Action failed: " + err);
      });
  }
})();
</script>
