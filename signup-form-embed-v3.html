<style>
  .sf-wrap {
    font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
    max-width: 520px;
    margin: 70px auto;
    padding: 0 20px;
  }
  .sf-head {
    text-align: center;
    margin-bottom: 36px;
  }
  .sf-head .eyebrow {
    display: inline-block;
    background: #f3e8f1;
    color: #714B67;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .sf-head h2 {
    font-size: 32px;
    font-weight: 800;
    color: #0f0f1a;
    margin: 0 0 8px;
    letter-spacing: -0.5px;
  }
  .sf-head p {
    color: #6b7280;
    font-size: 15px;
  }
  .sf-card {
    background: linear-gradient(160deg, #2b1930 0%, #714B67 100%);
    border-radius: 20px;
    padding: 40px 34px;
    color: #fff;
    box-shadow: 0 20px 50px rgba(43, 25, 48, 0.25);
    position: relative;
    overflow: hidden;
  }
  .sf-card::before {
    content: "";
    position: absolute;
    top: -60px;
    right: -60px;
    width: 180px;
    height: 180px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .sf-field {
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }
  .sf-field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.75;
    margin-bottom: 8px;
  }
  .sf-field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .sf-field input::placeholder {
    color: rgba(255,255,255,0.45);
  }
  .sf-field input:focus {
    border-color: #fff;
    background: rgba(255,255,255,0.14);
  }
  .sf-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    position: relative;
    z-index: 1;
  }
  .sf-submit {
    width: 100%;
    padding: 14px 0;
    border-radius: 10px;
    border: none;
    background: #fff;
    color: #2b1930;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s ease, opacity 0.15s ease;
    position: relative;
    z-index: 1;
  }
  .sf-submit:hover { transform: translateY(-2px); }
  .sf-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .sf-status {
    margin-top: 20px;
    font-size: 14px;
    text-align: center;
    background: rgba(255,255,255,0.1);
    padding: 14px;
    border-radius: 10px;
    display: none;
    position: relative;
    z-index: 1;
    line-height: 1.6;
  }
  .sf-status.show { display: block; }
  .sf-status.error { background: rgba(255,0,0,0.2); }
  .sf-status.success { background: rgba(0,255,0,0.15); }
</style>

<div class="sf-wrap">
  <div class="sf-head">
    <span class="eyebrow">Create Your Instance</span>
    <h2>Set Up Your Workspace</h2>
    <p>Your isolated Odoo instance, ready in minutes.</p>
  </div>

  <div class="sf-card">
    <form id="odoo-signup-form">
      <div class="sf-field">
        <label>Full Name</label>
        <input type="text" id="full_name" placeholder="John Smith" required="">
      </div>

      <div class="sf-field">
        <label>Company Name</label>
        <input type="text" id="company_name" placeholder="Acme Corp" required="">
        <small style="color: rgba(255,255,255,0.5); font-size: 12px;">Your subdomain will be auto-generated from this</small>
      </div>

      <div class="sf-field">
        <label>Email</label>
        <input type="email" id="email" placeholder="john@company.com" required="">
      </div>

      <div class="sf-field">
        <label>Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" required="" minlength="8">
        <small style="color: rgba(255,255,255,0.5); font-size: 12px;">Used to log in to your portal and your Odoo instance</small>
      </div>

      <div class="sf-field">
        <label>Confirm Password</label>
        <input type="password" id="password_confirm" placeholder="Repeat password" required="" minlength="8">
      </div>

      <div class="sf-row">
        <div class="sf-field">
          <label>Country</label>
          <input type="text" id="country" placeholder="Pakistan">
        </div>
        <div class="sf-field">
          <label>City</label>
          <input type="text" id="city" placeholder="Islamabad">
        </div>
      </div>

      <div class="sf-field">
        <label>Address</label>
        <input type="text" id="address" placeholder="Street, building">
      </div>

      <input type="hidden" id="package" value="starter">

      <button type="submit" class="sf-submit" id="sf-submit-btn">Create My Instance</button>
    </form>

    <div id="signup-status" class="sf-status"></div>
  </div>
</div>

<script>
(function() {
  var API_BASE = "http://localhost:8000";

  // Best-effort country name -> ISO code, since odoo_config.py matches
  // res.country by exact 2-letter code. Falls back to leaving it unset
  // (provisioning still succeeds, company just won't have a country set).
  var COUNTRY_CODES = {
    "pakistan": "PK", "united states": "US", "usa": "US",
    "united kingdom": "GB", "uk": "GB", "canada": "CA",
    "india": "IN", "germany": "DE", "france": "FR",
    "australia": "AU", "united arab emirates": "AE", "uae": "AE"
  };

  function slugify(str) {
    return str
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 40);
  }

  // Get package from URL parameter
  function getPackageFromURL() {
    var params = new URLSearchParams(window.location.search);
    var pkg = params.get('package');
    var validPackages = ['starter', 'business', 'enterprise'];

    if (pkg && validPackages.includes(pkg)) {
      return pkg;
    }

    var stored = localStorage.getItem('selected_package');
    if (stored && validPackages.includes(stored)) {
      return stored;
    }

    return 'starter';
  }

  var selectedPackage = getPackageFromURL();
  document.getElementById('package').value = selectedPackage;

  console.log('Selected package:', selectedPackage);

  document.getElementById("odoo-signup-form").addEventListener("submit", function(e) {
    e.preventDefault();

    var statusDiv = document.getElementById("signup-status");
    var submitBtn = document.getElementById("sf-submit-btn");

    var fullName = document.getElementById("full_name").value.trim();
    var companyName = document.getElementById("company_name").value.trim();
    var email = document.getElementById("email").value.trim();
    var address = document.getElementById("address").value.trim();
    var city = document.getElementById("city").value.trim();
    var country = document.getElementById("country").value.trim();

    if (!fullName) {
      statusDiv.className = "sf-status show error";
      statusDiv.innerHTML = "Please enter your full name";
      return;
    }
    if (!companyName) {
      statusDiv.className = "sf-status show error";
      statusDiv.innerHTML = "Please enter company name";
      return;
    }
    if (!email) {
      statusDiv.className = "sf-status show error";
      statusDiv.innerHTML = "Please enter your email";
      return;
    }
    var password = document.getElementById("password").value;
    var passwordConfirm = document.getElementById("password_confirm").value;
    if (!password || password.length < 8) {
      statusDiv.className = "sf-status show error";
      statusDiv.innerHTML = "Password must be at least 8 characters";
      return;
    }
    if (password !== passwordConfirm) {
      statusDiv.className = "sf-status show error";
      statusDiv.innerHTML = "Passwords do not match";
      return;
    }

    // customer_slug is required by /provision and wasn't being sent at all -
    // derive it from the company name, same idea the placeholder text promises.
    var customerSlug = slugify(companyName) || slugify(fullName) || ("customer-" + Date.now());
    var countryCode = COUNTRY_CODES[country.toLowerCase()] || undefined;

    // Shape matches ProvisionRequest / CompanyInfo in app/routers/provision.py exactly.
    var payload = {
      customer_slug: customerSlug,
      package: document.getElementById("package").value,
      admin_password: password,
      company_info: {
        name: companyName,
        email: email,
        street: address || undefined,
        city: city || undefined,
        country_code: countryCode
      }
    };

    statusDiv.className = "sf-status show";
    statusDiv.innerHTML = "Submitting...";
    submitBtn.disabled = true;

    fetch(API_BASE + "/provision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(function(res) {
      if (!res.ok) {
        return res.json().then(function(data) {
          throw new Error(formatError(data.detail) || ("Server error: " + res.status));
        });
      }
      return res.json();
    })
    .then(function(data) {
      statusDiv.className = "sf-status show success";
      statusDiv.innerHTML = "Provisioning started. This takes 15-30 seconds...";
      pollStatus(data.customer_slug, statusDiv, submitBtn, email);
    })
    .catch(function(err) {
      statusDiv.className = "sf-status show error";
      statusDiv.innerHTML = "Error: " + err.message;
      submitBtn.disabled = false;
    });
  });

  // FastAPI/Pydantic validation errors come back as an array of objects
  // (each with loc/msg/type), not a string - stringifying that array
  // directly is what produced "Error: [object Object]".
  function formatError(detail) {
    if (!detail) return null;
    if (typeof detail === "string") return detail;
    if (Array.isArray(detail)) {
      return detail.map(function(d) {
        var field = Array.isArray(d.loc) ? d.loc.slice(1).join(".") : "";
        return (field ? field + ": " : "") + (d.msg || JSON.stringify(d));
      }).join("; ");
    }
    return JSON.stringify(detail);
  }

  function pollStatus(slug, statusDiv, submitBtn, email) {
    var attempts = 0;
    var interval = setInterval(function() {
      attempts++;
      fetch(API_BASE + "/provision/status/" + slug)
        .then(function(res) {
          if (!res.ok) {
            throw new Error("Status check failed: " + res.status);
          }
          return res.json();
        })
        .then(function(data) {
          if (data.state === "done" || data.state === "success") {
            clearInterval(interval);
            var mainSiteSync = data.main_site_sync;
            if (mainSiteSync && mainSiteSync.success === false) {
              // Instance itself is fine, but the portal-account link failed -
              // surface it instead of silently sending them to a login that
              // won't have portal access yet.
              statusDiv.className = "sf-status show error";
              statusDiv.innerHTML = "Instance created, but portal login setup failed: " +
                (mainSiteSync.error || "unknown error") + ". Contact support.";
              submitBtn.disabled = false;
              return;
            }
            statusDiv.className = "sf-status show success";
            statusDiv.innerHTML = "Your instance is ready. Redirecting to login...";
            submitBtn.disabled = false;
            setTimeout(function() {
              // Pre-fill the login field only - never put a password in a URL
              // (browser history, server logs, Referer headers would all leak it).
              window.location.href = "http://localhost:8069/web/login?login=" +
                encodeURIComponent(email);
            }, 3000);
          } else if (data.state === "failed" || data.state === "error") {
            clearInterval(interval);
            statusDiv.className = "sf-status show error";
            statusDiv.innerHTML = "Provisioning failed: " + (data.error || "Unknown error");
            submitBtn.disabled = false;
          } else {
            statusDiv.innerHTML = "Status: " + data.state + "...";
          }
        })
        .catch(function(err) {
          if (attempts > 30) {
            clearInterval(interval);
            statusDiv.className = "sf-status show error";
            statusDiv.innerHTML = "Timeout - check server logs";
            submitBtn.disabled = false;
          }
        });
    }, 3000);
  }
})();
</script>
