<div id="signup-form-container" style="max-width:500px;margin:40px auto;font-family:sans-serif;">
  <h2 id="signup-title">Sign Up</h2>
  <form id="odoo-signup-form">
    <div style="margin-bottom:12px;">
      <label>Subdomain (e.g. "acme")</label><br/>
      <input type="text" id="customer_slug" required style="width:100%;padding:8px;"/>
    </div>
    <div style="margin-bottom:12px;">
      <label>Package</label><br/>
      <select id="package" required style="width:100%;padding:8px;">
        <option value="starter">Starter</option>
        <option value="business">Business</option>
        <option value="enterprise">Enterprise</option>
      </select>
    </div>
    <div style="margin-bottom:12px;">
      <label>Company Name</label><br/>
      <input type="text" id="company_name" required style="width:100%;padding:8px;"/>
    </div>
    <div style="margin-bottom:12px;">
      <label>City</label><br/>
      <input type="text" id="city" style="width:100%;padding:8px;"/>
    </div>
    <div style="margin-bottom:12px;">
      <label>Country Code (e.g. PK, US)</label><br/>
      <input type="text" id="country_code" maxlength="2" style="width:100%;padding:8px;"/>
    </div>
    <div style="margin-bottom:12px;">
      <label>Email</label><br/>
      <input type="email" id="email" required style="width:100%;padding:8px;"/>
    </div>
    <div style="margin-bottom:12px;">
      <label>Currency Code (e.g. USD, PKR)</label><br/>
      <input type="text" id="currency_code" style="width:100%;padding:8px;"/>
    </div>
    <div style="margin-bottom:12px;">
      <label>Timezone (e.g. Asia/Karachi)</label><br/>
      <input type="text" id="timezone" style="width:100%;padding:8px;"/>
    </div>
    <button type="submit" style="padding:10px 20px;background:#714B67;color:#fff;border:none;border-radius:4px;cursor:pointer;">
      Create My Instance
    </button>
  </form>
  <div id="signup-status" style="margin-top:20px;"></div>
</div>

<script>
(function() {
  var API_BASE = "http://localhost:8000"; // change to your real API domain in production

  // Pre-fill package from URL, e.g. /signup?package=business
  var urlParams = new URLSearchParams(window.location.search);
  var preselected = urlParams.get("package");
  if (preselected) {
    document.getElementById("package").value = preselected;
  }

  document.getElementById("odoo-signup-form").addEventListener("submit", function(e) {
    e.preventDefault();

    var slug = document.getElementById("customer_slug").value.trim().toLowerCase();
    var statusDiv = document.getElementById("signup-status");
    statusDiv.innerHTML = "Submitting...";

    var payload = {
      customer_slug: slug,
      package: document.getElementById("package").value,
      company_info: {
        name: document.getElementById("company_name").value,
        city: document.getElementById("city").value,
        country_code: document.getElementById("country_code").value,
        email: document.getElementById("email").value,
        currency_code: document.getElementById("currency_code").value,
        timezone: document.getElementById("timezone").value
      }
    };

    fetch(API_BASE + "/provision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.detail) {
        statusDiv.innerHTML = "Error: " + data.detail;
        return;
      }
      statusDiv.innerHTML = "Provisioning started. This may take 1-2 minutes...";
      pollStatus(slug, statusDiv);
    })
    .catch(function(err) {
      statusDiv.innerHTML = "Request failed: " + err;
    });
  });

  function pollStatus(slug, statusDiv) {
    var interval = setInterval(function() {
      fetch(API_BASE + "/provision/status/" + slug)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.state === "done") {
            clearInterval(interval);
            statusDiv.innerHTML = "Your instance is ready! Domain: " +
              (data.nginx ? data.nginx.domain : slug + ".yourdomain.com") +
              "<br/>Login: admin@" + slug + ".local";
          } else if (data.state === "failed") {
            clearInterval(interval);
            statusDiv.innerHTML = "Provisioning failed: " + data.error;
          } else {
            statusDiv.innerHTML = "Status: " + data.state + "...";
          }
        });
    }, 4000);
  }
})();
</script>
