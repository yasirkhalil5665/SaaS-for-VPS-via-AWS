<style>
  .sf-wrap {
    font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
    max-width: 520px;
    margin: 70px auto;
    padding: 0 20px;
  }
  .sf-head {
    text-align: center;
    margin-bottom: 36px;
  }
  .sf-head .eyebrow {
    display: inline-block;
    background: #f3e8f1;
    color: #714B67;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .sf-head h2 {
    font-size: 32px;
    font-weight: 800;
    color: #0f0f1a;
    margin: 0 0 8px;
    letter-spacing: -0.5px;
  }
  .sf-head p {
    color: #6b7280;
    font-size: 15px;
  }
  .sf-card {
    background: linear-gradient(160deg, #2b1930 0%, #714B67 100%);
    border-radius: 20px;
    padding: 40px 34px;
    color: #fff;
    box-shadow: 0 20px 50px rgba(43, 25, 48, 0.25);
    position: relative;
    overflow: hidden;
  }
  .sf-card::before {
    content: "";
    position: absolute;
    top: -60px;
    right: -60px;
    width: 180px;
    height: 180px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .sf-field {
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }
  .sf-field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.75;
    margin-bottom: 8px;
  }
  .sf-field input,
  .sf-field select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .sf-field input::placeholder {
    color: rgba(255,255,255,0.45);
  }
  .sf-field input:focus,
  .sf-field select:focus {
    border-color: #fff;
    background: rgba(255,255,255,0.14);
  }
  .sf-field select option {
    color: #0f0f1a;
  }
  .sf-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    position: relative;
    z-index: 1;
  }
  .sf-submit {
    width: 100%;
    padding: 14px 0;
    border-radius: 10px;
    border: none;
    background: #fff;
    color: #2b1930;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s ease, opacity 0.15s ease;
    position: relative;
    z-index: 1;
  }
  .sf-submit:hover { transform: translateY(-2px); }
  .sf-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .sf-status {
    margin-top: 20px;
    font-size: 14px;
    text-align: center;
    background: rgba(255,255,255,0.1);
    padding: 14px;
    border-radius: 10px;
    display: none;
    position: relative;
    z-index: 1;
    line-height: 1.6;
  }
  .sf-status.show { display: block; }
</style>

<div class="sf-wrap">
  <div class="sf-head">
    <span class="eyebrow">Create Your Instance</span>
    <h2>Set Up Your Workspace</h2>
    <p>Your isolated Odoo instance, ready in minutes.</p>
  </div>

  <div class="sf-card">
    <form id="odoo-signup-form">
      <div class="sf-field">
        <label>Subdomain</label>
        <input type="text" id="customer_slug" placeholder="e.g. acme" required/>
      </div>

      <div class="sf-field">
        <label>Package</label>
        <select id="package" required>
          <option value="starter">Starter — $29/mo</option>
          <option value="business">Business — $79/mo</option>
          <option value="enterprise">Enterprise — $199/mo</option>
        </select>
      </div>

      <div class="sf-field">
        <label>Company Name</label>
        <input type="text" id="company_name" placeholder="Acme Corp" required/>
      </div>

      <div class="sf-row">
        <div class="sf-field">
          <label>City</label>
          <input type="text" id="city" placeholder="Peshawar"/>
        </div>
        <div class="sf-field">
          <label>Country Code</label>
          <input type="text" id="country_code" placeholder="PK" maxlength="2"/>
        </div>
      </div>

      <div class="sf-field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@company.com" required/>
      </div>

      <div class="sf-row">
        <div class="sf-field">
          <label>Currency</label>
          <input type="text" id="currency_code" placeholder="USD"/>
        </div>
        <div class="sf-field">
          <label>Timezone</label>
          <input type="text" id="timezone" placeholder="Asia/Karachi"/>
        </div>
      </div>

      <button type="submit" class="sf-submit" id="sf-submit-btn">Create My Instance</button>
    </form>

    <div id="signup-status" class="sf-status"></div>
  </div>
</div>

<script>
(function() {
  var API_BASE = "http://localhost:8000"; // change to your real API domain in production

  var urlParams = new URLSearchParams(window.location.search);
  var preselected = urlParams.get("package");
  if (preselected) {
    document.getElementById("package").value = preselected;
  }

  document.getElementById("odoo-signup-form").addEventListener("submit", function(e) {
    e.preventDefault();

    var slug = document.getElementById("customer_slug").value.trim().toLowerCase();
    var statusDiv = document.getElementById("signup-status");
    var submitBtn = document.getElementById("sf-submit-btn");
    statusDiv.classList.add("show");
    statusDiv.innerHTML = "Submitting...";
    submitBtn.disabled = true;

    var payload = {
      customer_slug: slug,
      package: document.getElementById("package").value,
      company_info: {
        name: document.getElementById("company_name").value,
        city: document.getElementById("city").value,
        country_code: document.getElementById("country_code").value,
        email: document.getElementById("email").value,
        currency_code: document.getElementById("currency_code").value,
        timezone: document.getElementById("timezone").value
      }
    };

    fetch(API_BASE + "/provision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.detail) {
        statusDiv.innerHTML = "Error: " + data.detail;
        submitBtn.disabled = false;
        return;
      }
      statusDiv.innerHTML = "Provisioning started. This may take 1-2 minutes...";
      pollStatus(slug, statusDiv, submitBtn);
    })
    .catch(function(err) {
      statusDiv.innerHTML = "Request failed: " + err;
      submitBtn.disabled = false;
    });
  });

  function pollStatus(slug, statusDiv, submitBtn) {
    var interval = setInterval(function() {
      fetch(API_BASE + "/provision/status/" + slug)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.state === "done") {
            clearInterval(interval);
            var domain = data.nginx ? data.nginx.domain : slug + ".yourdomain.com";
            statusDiv.innerHTML = "&#10003; Your instance is ready! Redirecting to your login page...";
            setTimeout(function() {
              window.location.href = "http://" + domain + "/web/login";
            }, 2500);
          } else if (data.state === "failed") {
            clearInterval(interval);
            statusDiv.innerHTML = "Provisioning failed: " + data.error;
            submitBtn.disabled = false;
          } else {
            statusDiv.innerHTML = "Status: " + data.state + "...";
          }
        });
    }, 4000);
  }
})();
</script>
